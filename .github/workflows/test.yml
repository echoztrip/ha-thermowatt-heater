name: Bridge regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests paho-mqtt PyYAML jinja2
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile thermowatt-heater/thermowatt_bridge.py
      - run: bash -n thermowatt-heater/run.sh
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Supervisor arguments and no BUILD_FROM override
        run: >-
          docker build --build-arg BUILD_ARCH=amd64 --build-arg BUILD_VERSION=1.3.2
          -t thermowatt-test thermowatt-heater
      - name: Check installed dependencies and startup script
        run: |
          docker run --rm --entrypoint python3 thermowatt-test -c "import requests, urllib3, paho.mqtt.client; compile(open('/thermowatt_bridge.py').read(), '/thermowatt_bridge.py', 'exec')"
          docker run --rm --entrypoint bash thermowatt-test -c 'test -x /command/with-contenv && command -v bashio && bash -n /run.sh'
