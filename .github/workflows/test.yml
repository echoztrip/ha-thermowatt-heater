name: Bridge regression tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests paho-mqtt PyYAML jinja2
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile thermowatt-heater/thermowatt_bridge.py
      - run: bash -n thermowatt-heater/run.sh
